[package]
name = "feather"
version = "0.4.0"
edition = "2024"
description = "A fast, minimal repository viewer and git client"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "persistence", "default_fonts", "clipboard", "links"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "svg", "http"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "svg", "fetch"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
pollster = "0.4"
ureq = "3"
serde_json = "1"
# Same version egui_extras uses; "text" lets SVGs (README badges) show their labels.
resvg = { version = "0.45", default-features = false, features = ["text"] }
sha2 = "0.11"
self-replace = "1"
portable-pty = "0.9"
vt100 = "0.18"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
