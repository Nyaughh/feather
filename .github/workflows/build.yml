name: Build

# The website and docs don't affect the app, so they don't trigger a build.
on:
  push:
    branches: ['**']
    paths-ignore: ['site/**', 'tools/build-site.mjs', 'vercel.json', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'tools/build-site.mjs', 'vercel.json', '**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: feather-linux-x86_64
            binary: feather
          - os: macos-latest
            artifact: feather-macos-arm64
            binary: feather
          - os: windows-latest
            artifact: feather-windows-x86_64
            binary: feather.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      # Building the installer here keeps the release from being the first
      # place a mistake in it shows up.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/build-windows-installer.ps1 0.0.0
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: feather-windows-x86_64-setup
          path: feather-windows-x86_64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
